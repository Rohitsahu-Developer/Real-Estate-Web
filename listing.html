<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Available Flats</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="readme.md">
</head>
<body>

<h2>Available Flats</h2>

<div class="filters">
  <input type="text" id="location" placeholder="Enter Location">

  <select id="bhk">
    <option value="">Select BHK</option>
    <option value="1">1 BHK</option>
    <option value="2">2 BHK</option>
    <option value="3">3 BHK</option>
  </select>

  <select id="budget">
    <option value="">Select Budget</option>
    <option value="3000000">Below 30 Lakh</option>
    <option value="5000000">Below 50 Lakh</option>
  </select>
</div>

<div id="property-list" class="grid"></div>

<script src="js/script.js"></script>


<select id="locationFilter" onchange="applyFilters()">
  <option value="">All Locations</option>
  <option>Delhi</option>
  <option>Mumbai</option>
  <option>Pune</option>
</select>

<select id="bhkFilter" onchange="applyFilters()">
  <option value="">All BHK</option>
  <option value="1">1 BHK</option>
  <option value="2">2 BHK</option>
  <option value="3">3 BHK</option>
</select>

<select id="sortFilter" onchange="applyFilters()">
  <option value="">Sort By</option>
  <option value="low">Price: Low to High</option>
  <option value="high">Price: High to Low</option>
</select>

<button onclick="resetFilters()">Clear Filters</button>
<div id="listingContainer" class="grid"></div>

</body>
</html>
